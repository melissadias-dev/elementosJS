<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function minhaFuncao(){
        texto = prompt("digite a bebida: ")

        const node = document.createElement("li")

        const textnode = document.createTextNode(texto)
        node.appendChild(textnode)

        document.getElementById("minhaLista").appendChild(node)
    }
</script>
<body>
    <h1>Objetos Elementos</h1>
    <h2 id="titulo">Elemento Appendchild()</h2>
    <ul id="minhaLista">
        <li>Café</li>
        <li>Chá</li>
    </ul>
    <p>Clique aqui para adicionar na lista:</p>
    <button onclick="minhaFuncao()">Append um filho</button>

</body>
</html>
